<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><title>Fargate to EKS: approximately 32% lower total AWS bill</title><desc>Architecture summary of a completed migration and cost optimization project. Production and preprod share On-Demand EKS capacity across three availability zones. Karpenter manages nodes, HPA/KEDA scales applications, and Spot is reserved for isolated testing. Data services remain on EC2. Savings measured over a 90-day period.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c30"/><stop offset="1" stop-color="#071221"/></linearGradient><linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="460" y1="675" x2="600" y2="675"><stop stop-color="#f6a14d"/><stop offset="1" stop-color="#2b8ee6"/></linearGradient><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2b8ee6"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#36485f"/></pattern></defs><rect x="0" y="0" width="1800" height="1200" rx="0" fill="url(#bg)" stroke="none" /><rect x="1270" y="0" width="530" height="325" rx="0" fill="url(#dots)" stroke="none" /><rect x="70" y="55" width="42" height="5" rx="2" fill="#ffab5c" stroke="none" /><text x="130" y="65" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#a9bdd4" text-anchor="start" letter-spacing="2">AWS / MIGRATION &amp; COST OPTIMIZATION</text><text x="70" y="148" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#ffffff" text-anchor="start" >Less AWS spend.</text><text x="70" y="220" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#ffffff" text-anchor="start" >More elastic capacity.</text><text x="72" y="280" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#afc5df" text-anchor="start" >ECS Fargate → Amazon EKS + Karpenter</text><path d="M1120 65V275" fill="none" stroke="#2a3c52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="1170" y="198" font-family="Arial, Helvetica, sans-serif" font-size="130" font-weight="700" fill="#68e5bb" text-anchor="start" >≈32%</text><text x="1176" y="241" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="1.5">LOWER TOTAL AWS BILL</text><text x="1176" y="278" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#afc5df" text-anchor="start" >Measured over a 90-day period</text><rect x="55" y="335" width="1690" height="725" rx="28" fill="#f5f8fc" stroke="none" /><text x="95" y="390" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#61768e" text-anchor="start" letter-spacing="2">THE MIGRATION</text><rect x="1370" y="362" width="335" height="36" rx="18" fill="#e4edf8" stroke="none" /><text x="1537.5" y="387" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#34597c" text-anchor="middle" >Production on On-Demand</text><rect x="95" y="432" width="52" height="36" rx="18" fill="#fff0df" stroke="none" /><text x="121.0" y="457" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ae5b16" text-anchor="middle" >01</text><text x="166" y="459" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#142b47" text-anchor="start" >ECS Fargate</text><text x="95" y="503" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#60748c" text-anchor="start" >Separate application environments</text><rect x="95" y="535" width="345" height="124" rx="18" fill="#ffffff" stroke="#e2e9f1" /><rect x="118" y="564" width="25" height="25" rx="5" fill="none" stroke="#d58232" stroke-width="2.5"/><rect x="150" y="564" width="25" height="25" rx="5" fill="none" stroke="#d58232" stroke-width="2.5"/><rect x="134" y="593" width="25" height="25" rx="5" fill="none" stroke="#d58232" stroke-width="2.5"/><text x="202" y="583" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#142b47" text-anchor="start" >Production</text><text x="202" y="619" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61768e" text-anchor="start" >Always running</text><rect x="95" y="680" width="345" height="124" rx="18" fill="#ffffff" stroke="#e2e9f1" /><rect x="118" y="709" width="25" height="25" rx="5" fill="none" stroke="#d58232" stroke-width="2.5"/><rect x="150" y="709" width="25" height="25" rx="5" fill="none" stroke="#d58232" stroke-width="2.5"/><rect x="134" y="738" width="25" height="25" rx="5" fill="none" stroke="#d58232" stroke-width="2.5"/><text x="202" y="728" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#142b47" text-anchor="start" >Preprod</text><text x="202" y="764" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61768e" text-anchor="start" >Always running</text><rect x="95" y="827" width="345" height="36" rx="18" fill="#fff0df" stroke="none" /><text x="267.5" y="852" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#a65c1c" text-anchor="middle" >Variable demand · ~5-hour peak</text><path d="M460 675H600" fill="none" stroke="url(#flow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="532" y="627" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#60748c" text-anchor="middle" letter-spacing="1">PHASED</text><text x="532" y="650" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#60748c" text-anchor="middle" letter-spacing="1">CUTOVER</text><text x="532" y="723" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#60748c" text-anchor="middle" >Rollback</text><text x="532" y="749" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#60748c" text-anchor="middle" >procedures</text><rect x="625" y="424" width="1080" height="460" rx="22" fill="#eaf1fc" stroke="#c4d7ef" stroke-width="2"/><polygon points="668,440 692,454 692,481 668,495 644,481 644,454" fill="#2f79dc"/><circle cx="668" cy="467" r="15" fill="none" stroke="white" stroke-width="2"/><circle cx="668" cy="467" r="4" fill="white"/><path d="M668 467L668.0 488.0" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M668 467L684.4 480.1" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M668 467L688.5 462.3" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M668 467L677.1 448.1" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M668 467L658.9 448.1" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M668 467L647.5 462.3" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M668 467L651.6 480.1" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="710" y="479" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#142b47" text-anchor="start" >Amazon EKS</text><rect x="1451" y="447" width="226" height="36" rx="18" fill="#ffffff" stroke="none" /><text x="1564.0" y="472" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#3b638f" text-anchor="middle" >Three Availability Zones</text><rect x="650" y="513" width="662" height="270" rx="16" fill="#ffffff" stroke="none" /><text x="675" y="550" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#3568a1" text-anchor="start" letter-spacing="1">SHARED APPLICATION CAPACITY</text><rect x="675" y="574" width="192" height="119" rx="12" fill="#f1f6fd" stroke="#d4e2f4" /><rect x="693" y="592" width="60" height="48" rx="8" fill="none" stroke="#3878cb" stroke-width="2.5"/><path d="M705 609h25 M705 623h25" fill="none" stroke="#3878cb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="740" cy="609" r="3" fill="#3878cb"/><circle cx="740" cy="623" r="3" fill="#3878cb"/><text x="789" y="613" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#426b9b" text-anchor="middle" >AZ A</text><text x="789" y="643" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#426b9b" text-anchor="middle" >EC2</text><text x="771" y="677" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#34659e" text-anchor="middle" >On-Demand</text><rect x="885" y="574" width="192" height="119" rx="12" fill="#f1f6fd" stroke="#d4e2f4" /><rect x="903" y="592" width="60" height="48" rx="8" fill="none" stroke="#3878cb" stroke-width="2.5"/><path d="M915 609h25 M915 623h25" fill="none" stroke="#3878cb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="950" cy="609" r="3" fill="#3878cb"/><circle cx="950" cy="623" r="3" fill="#3878cb"/><text x="999" y="613" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#426b9b" text-anchor="middle" >AZ B</text><text x="999" y="643" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#426b9b" text-anchor="middle" >EC2</text><text x="981" y="677" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#34659e" text-anchor="middle" >On-Demand</text><rect x="1095" y="574" width="192" height="119" rx="12" fill="#f1f6fd" stroke="#d4e2f4" /><rect x="1113" y="592" width="60" height="48" rx="8" fill="none" stroke="#3878cb" stroke-width="2.5"/><path d="M1125 609h25 M1125 623h25" fill="none" stroke="#3878cb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1160" cy="609" r="3" fill="#3878cb"/><circle cx="1160" cy="623" r="3" fill="#3878cb"/><text x="1209" y="613" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#426b9b" text-anchor="middle" >AZ C</text><text x="1209" y="643" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#426b9b" text-anchor="middle" >EC2</text><text x="1191" y="677" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#34659e" text-anchor="middle" >On-Demand</text><rect x="675" y="717" width="278" height="36" rx="18" fill="#deebff" stroke="none" /><text x="814.0" y="742" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#285a9b" text-anchor="middle" >Production</text><rect x="971" y="717" width="316" height="36" rx="18" fill="#e9e6ff" stroke="none" /><text x="1129.0" y="742" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64519b" text-anchor="middle" >Preprod</text><rect x="1335" y="513" width="345" height="338" rx="16" fill="#e0f4ed" stroke="#95cbb9" stroke-width="2" stroke-dasharray="6 5"/><text x="1360" y="550" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2f7e66" text-anchor="start" letter-spacing="1">ISOLATED TEST POOL</text><path d="M1485 575l-22 36h24l-10 31 37-46h-25l11-21" fill="none" stroke="#258567" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="1507" y="684" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#176f56" text-anchor="middle" >Spot</text><text x="1507" y="719" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#326d5b" text-anchor="middle" >Load tests on demand</text><text x="1507" y="751" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#326d5b" text-anchor="middle" >Separate test apps + data</text><rect x="1360" y="788" width="295" height="36" rx="18" fill="#c5e9dd" stroke="none" /><text x="1507.5" y="813" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#286d56" text-anchor="middle" >No production workloads</text><rect x="650" y="802" width="662" height="49" rx="10" fill="#d9e7fc" stroke="none" /><text x="674" y="834" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2e5f9c" text-anchor="start" >Karpenter</text><text x="798" y="834" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#476a94" text-anchor="start" >nodes</text><text x="982" y="834" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2e5f9c" text-anchor="start" >HPA/KEDA</text><text x="1115" y="834" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#476a94" text-anchor="start" >replicas</text><rect x="95" y="918" width="1610" height="101" rx="16" fill="#ffffff" stroke="#e0e8f1" /><rect x="120" y="945" width="60" height="48" rx="8" fill="none" stroke="#6884a4" stroke-width="2.5"/><path d="M132 962h25 M132 976h25" fill="none" stroke="#6884a4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="167" cy="962" r="3" fill="#6884a4"/><circle cx="167" cy="976" r="3" fill="#6884a4"/><text x="205" y="958" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#142b47" text-anchor="start" >Data stays on EC2</text><text x="205" y="991" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#60748c" text-anchor="start" >PostgreSQL · MongoDB · ELK</text><path d="M665 941V997" fill="none" stroke="#e0e8f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="700" y="958" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#142b47" text-anchor="start" >System services</text><text x="700" y="991" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#60748c" text-anchor="start" >Dedicated On-Demand node group</text><path d="M1145 941V997" fill="none" stroke="#e0e8f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="1180" y="958" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#142b47" text-anchor="start" >PostgreSQL rightsizing</text><text x="1180" y="991" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#60748c" text-anchor="start" >Separate optimization step</text><rect x="70" y="1094" width="146" height="36" rx="18" fill="#22344d" stroke="none" /><text x="143.0" y="1119" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c5d9f0" text-anchor="middle" >Terraform</text><rect x="230" y="1094" width="110" height="36" rx="18" fill="#22344d" stroke="none" /><text x="285.0" y="1119" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c5d9f0" text-anchor="middle" >Helm</text><rect x="354" y="1094" width="196" height="36" rx="18" fill="#22344d" stroke="none" /><text x="452.0" y="1119" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c5d9f0" text-anchor="middle" >GitLab CI/CD</text><text x="1730" y="1119" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#deebfb" text-anchor="end" >Scale with demand. Consolidate after peaks.</text><text x="70" y="1170" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#8fa6c0" text-anchor="start" >Simplified architecture; symbols do not represent node counts.</text><text x="1730" y="1170" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#8fa6c0" text-anchor="end" >Savings reflect the combined migration and optimization project.</text></svg>