apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workload-pool-isolation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: pool
      expression: "object.metadata.namespace == 'testing' ? 'testing' : 'applications'"
    - name: capacity
      expression: "object.metadata.namespace == 'testing' ? 'spot' : 'on-demand'"
    - name: priority
      expression: "object.metadata.namespace == 'production' ? 'production' : 'nonproduction'"
  validations:
    - expression: "has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(r, has(r.controller) && r.controller && r.kind in ['ReplicaSet', 'StatefulSet', 'DaemonSet', 'Job'])"
      message: Application pods must be managed by a workload controller.
    - expression: "has(object.spec.nodeSelector) && 'workload.example.com/pool' in object.spec.nodeSelector && object.spec.nodeSelector['workload.example.com/pool'] == variables.pool && 'karpenter.sh/capacity-type' in object.spec.nodeSelector && object.spec.nodeSelector['karpenter.sh/capacity-type'] == variables.capacity"
      message: Pod must select its namespace-approved pool and capacity type.
    - expression: "has(object.spec.priorityClassName) && object.spec.priorityClassName == variables.priority"
      message: Pod must use its namespace-approved PriorityClass.
    - expression: "!has(object.spec.tolerations) || object.spec.tolerations.all(t, (has(t.key) && t.key == 'workload.example.com/pool' && has(t.operator) && t.operator == 'Equal' && has(t.value) && t.value == variables.pool && has(t.effect) && t.effect == 'NoSchedule') || (has(t.key) && t.key in ['node.kubernetes.io/not-ready', 'node.kubernetes.io/unreachable'] && has(t.operator) && t.operator == 'Exists' && has(t.effect) && t.effect == 'NoExecute'))"
      message: Broad tolerations and tolerations for other pools are prohibited.
    - expression: "request.operation != 'CREATE' || !has(object.spec.nodeName) || object.spec.nodeName == ''"
      message: Pod creation must not bypass the scheduler with nodeName.
    - expression: "!has(object.spec.schedulerName) || object.spec.schedulerName == 'default-scheduler'"
      message: Pod must use the default scheduler.
    - expression: "!has(object.metadata.annotations) || !('k8s.v1.cni.cncf.io/networks' in object.metadata.annotations)"
      message: Additional pod network attachments are prohibited.
    - expression: "object.spec.containers.all(c, has(c.resources) && has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests)"
      message: Every application container must request CPU and memory.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: workload-pool-isolation
spec:
  policyName: workload-pool-isolation
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [production, preprod, testing]
