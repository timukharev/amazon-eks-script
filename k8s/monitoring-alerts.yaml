apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: workload-capacity
  namespace: monitoring
spec:
  groups:
    - name: workload-capacity
      rules:
        - alert: ProductionPodsPending
          expr: sum(kube_pod_status_phase{namespace="production",phase="Pending"} == 1) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Production pods remain pending
        - alert: ProductionHPAAtMaximum
          expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="production"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="production"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Production HPA has reached its configured maximum
        - alert: ProductionCPUThrottling
          expr: sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="production",container!=""}[5m])) / sum by (namespace, pod) (rate(container_cpu_cfs_periods_total{namespace="production",container!=""}[5m])) > 0.25
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Production containers have sustained CPU throttling
