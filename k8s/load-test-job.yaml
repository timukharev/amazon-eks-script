apiVersion: batch/v1
kind: Job
metadata:
  name: isolated-load-test
  namespace: testing
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: isolated-load-test
    spec:
      restartPolicy: Never
      serviceAccountName: load-test
      automountServiceAccountToken: false
      priorityClassName: nonproduction
      nodeSelector:
        workload.example.com/pool: testing
        karpenter.sh/capacity-type: spot
      tolerations:
        - key: workload.example.com/pool
          operator: Equal
          value: testing
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        runAsGroup: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:0.57.0
          args: [run, /scripts/load-test.js]
          env:
            - name: LOAD_TEST_URL
              valueFrom:
                configMapKeyRef:
                  name: load-test-target
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: load-test-script
        - name: tmp
          emptyDir: {}
